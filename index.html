<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aljabar Cinta — Belajar Bentuk Aljabar dan Memecahkan Masalah</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:ital,wght@0,400;0,500;0,600;0,700;0,800;1,600&display=swap" rel="stylesheet">
<style>
:root{
  --green-deep:#2E7D4F;
  --green-soft:#8FD6A0;
  --green-pale:#EAF7EC;
  --blue-sky:#5FB6E5;
  --blue-deep:#173B4C;
  --cream:#FBF7EC;
  --yellow:#FFD873;
  --coral:#FF8F7A;
  --coral-pale:#FFEDE9;
  --ink:#1F3B33;
  --line:#E3DFD1;
  --white:#FFFFFF;
  --shadow: 0 10px 30px -12px rgba(23,59,76,0.18);
  --radius: 20px;
  --radius-sm: 12px;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  font-family:'Nunito',sans-serif;
  background:var(--cream);
  color:var(--ink);
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4,.display{
  font-family:'Baloo 2',cursive;
  color:var(--blue-deep);
  margin:0;
  line-height:1.15;
}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;}
img{max-width:100%;display:block;}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px;}
.badge{
  display:inline-flex;align-items:center;gap:6px;
  font-size:.78rem;font-weight:800;letter-spacing:.03em;
  padding:6px 14px;border-radius:999px;
  background:var(--green-pale);color:var(--green-deep);
  border:1.5px solid var(--green-soft);
}
.badge.coral{background:var(--coral-pale);color:#C24A34;border-color:#FFC7B8;}
.badge.blue{background:#E9F5FC;color:#1B5E82;border-color:#BFE3F5;}
.btn{
  display:inline-flex;align-items:center;gap:10px;
  padding:14px 26px;border-radius:999px;border:none;
  font-weight:800;font-size:1rem;font-family:'Baloo 2',cursive;
  transition:transform .15s ease, box-shadow .15s ease, background .15s ease;
  box-shadow:0 8px 20px -8px rgba(46,125,79,.5);
}
.btn:focus-visible{outline:3px solid var(--blue-deep);outline-offset:3px;}
.btn:active{transform:translateY(1px);}
.btn-primary{background:var(--green-deep);color:#fff;}
.btn-primary:hover{background:#256a42;transform:translateY(-2px);}
.btn-outline{background:#fff;color:var(--blue-deep);border:2px solid var(--blue-deep);box-shadow:none;}
.btn-outline:hover{background:var(--blue-deep);color:#fff;}
.btn-coral{background:var(--coral);color:#fff;box-shadow:0 8px 20px -8px rgba(255,143,122,.6);}
.btn-coral:hover{background:#f4735c;transform:translateY(-2px);}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none;}
.btn-sm{padding:9px 16px;font-size:.88rem;}

/* NAVBAR */
#navbar{
  position:sticky;top:0;z-index:100;
  background:rgba(251,247,236,.92);backdrop-filter:blur(8px);
  border-bottom:1.5px solid var(--line);
  transition:box-shadow .2s ease;
}
#navbar.scrolled{box-shadow:0 4px 20px -8px rgba(23,59,76,.25);}
.nav-inner{display:flex;align-items:center;justify-content:space-between;padding:12px 24px;max-width:1180px;margin:0 auto;}
.logo{display:flex;align-items:center;gap:10px;font-family:'Baloo 2';font-weight:800;font-size:1.25rem;color:var(--blue-deep);}
.logo-mark{
  width:40px;height:40px;border-radius:12px;
  background:linear-gradient(145deg,var(--green-deep),var(--green-soft));
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:1.2rem;font-weight:800;
  box-shadow:0 6px 14px -6px rgba(46,125,79,.6);
  position:relative;
}
.logo-mark svg{width:24px;height:24px;}
.nav-links{display:flex;gap:6px;align-items:center;}
.nav-links button{
  background:none;border:none;padding:10px 16px;border-radius:999px;
  font-weight:700;color:var(--blue-deep);font-size:.96rem;
  transition:background .15s, color .15s;
}
.nav-links button:hover,.nav-links button.active{background:var(--green-pale);color:var(--green-deep);}
.nav-cta{display:flex;align-items:center;gap:10px;}
.hamburger{display:none;background:none;border:none;padding:8px;}
.hamburger span{display:block;width:24px;height:3px;background:var(--blue-deep);margin:5px 0;border-radius:3px;transition:.2s;}
#mobileMenu{display:none;flex-direction:column;gap:4px;padding:10px 20px 18px;background:var(--cream);border-bottom:1.5px solid var(--line);}
#mobileMenu.open{display:flex;}
#mobileMenu button{text-align:left;background:none;border:none;padding:12px 10px;font-weight:700;color:var(--blue-deep);font-size:1rem;border-radius:10px;}
#mobileMenu button:hover{background:var(--green-pale);}

@media (max-width:880px){
  .nav-links{display:none;}
  .hamburger{display:block;}
  .nav-cta .btn span.long{display:none;}
}

/* progress mini bar under nav */
#progressStrip{height:5px;background:var(--line);position:relative;}
#progressFill{height:100%;background:linear-gradient(90deg,var(--green-deep),var(--green-soft));width:0%;transition:width .4s ease;}

/* SECTIONS */
section{padding:88px 0;}
.section-head{text-align:center;max-width:640px;margin:0 auto 48px;}
.eyebrow{font-weight:800;color:var(--coral);letter-spacing:.06em;text-transform:uppercase;font-size:.82rem;}
.section-head h2{font-size:2.1rem;margin-top:8px;}
.section-head p{color:#4A5D57;margin-top:12px;font-size:1.05rem;}

/* HERO */
#hero{
  padding:60px 0 90px;
  background:
    radial-gradient(circle at 85% 10%, rgba(255,216,115,.35), transparent 45%),
    radial-gradient(circle at 8% 85%, rgba(95,182,229,.22), transparent 45%),
    var(--cream);
  position:relative;overflow:hidden;
}
.hero-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:48px;align-items:center;}
.hero-copy h1{font-size:3.4rem;letter-spacing:-.01em;}
.hero-tagline{font-size:1.25rem;font-weight:700;color:var(--green-deep);margin-top:14px;}
.hero-sub{margin-top:8px;font-weight:800;color:var(--blue-deep);font-size:1rem;}
.hero-desc{margin-top:18px;color:#3E534C;font-size:1.05rem;max-width:480px;}
.hero-actions{display:flex;gap:14px;margin-top:30px;flex-wrap:wrap;}
.hero-badges{display:flex;gap:10px;margin-top:26px;flex-wrap:wrap;}
.hero-visual{position:relative;}
.hero-illustration{
  background:linear-gradient(160deg,#DCF3E1,#E8F6FB);
  border-radius:28px;padding:34px;position:relative;
  box-shadow:var(--shadow);
  border:2px solid #fff;
}
.floaty{position:absolute;animation:float 5s ease-in-out infinite;}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.leaf1{top:-18px;left:-18px;font-size:2.4rem;animation-delay:0s;}
.leaf2{bottom:-14px;right:-10px;font-size:2rem;animation-delay:1.2s;}
.heart-float{top:10px;right:20px;font-size:1.6rem;animation-delay:.6s;}

@media (max-width:880px){
  .hero-grid{grid-template-columns:1fr;}
  .hero-copy h1{font-size:2.4rem;}
}

/* VALUE CARDS (cinta lingkungan) */
.value-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;}
.value-card{
  background:#fff;border-radius:var(--radius);padding:30px 24px;text-align:center;
  border:1.5px solid var(--line);transition:transform .2s ease, box-shadow .2s ease;
}
.value-card:hover{transform:translateY(-6px);box-shadow:var(--shadow);}
.value-icon{font-size:2.4rem;margin-bottom:14px;}
.value-card h3{font-size:1.15rem;}
.value-card p{color:#5A6B65;font-size:.95rem;margin-top:8px;}

/* TUJUAN CARDS */
.goal-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:18px;}
.goal-card{
  background:#fff;border-radius:var(--radius-sm);padding:22px 18px;
  border:1.5px solid var(--line);position:relative;overflow:hidden;
  transition:transform .2s ease,box-shadow .2s;
}
.goal-card:hover{transform:translateY(-5px);box-shadow:var(--shadow);border-color:var(--green-soft);}
.goal-num{font-family:'Baloo 2';font-size:1.6rem;color:var(--green-soft);font-weight:800;}
.goal-icon{font-size:1.8rem;margin:8px 0 10px;}
.goal-card p{font-size:.88rem;color:#3E534C;}
@media (max-width:980px){.goal-grid{grid-template-columns:repeat(2,1fr);} .value-grid{grid-template-columns:1fr;}}
@media (min-width:981px) and (max-width:1180px){.goal-grid{grid-template-columns:repeat(3,1fr);}}

/* PETA KONSEP */
#peta{background:var(--white);}
.peta-diagram{display:none;}
.peta-root{
  background:var(--blue-deep);color:#fff;padding:16px 34px;border-radius:16px;
  font-family:'Baloo 2';font-weight:700;font-size:1.15rem;box-shadow:var(--shadow);
}
.peta-line{width:2px;height:34px;background:var(--line);}
/* PETA KONSEP - layout kartu sudut + panah, meniru referensi */
.peta-map{position:relative;max-width:940px;margin:0 auto;}
.peta-map svg.connectors{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none;}
.peta-map-grid{
  position:relative;z-index:2;
  display:grid;grid-template-columns:1fr 220px 1fr;grid-template-rows:auto 40px auto;
  align-items:center;gap:0 18px;
}
.peta-center-cell{grid-column:2;grid-row:1/4;display:flex;align-items:center;justify-content:center;}
.peta-center-box{
  background:#E4F1FB;border:2px solid #BFE3F5;border-radius:20px;
  padding:26px 22px;text-align:center;box-shadow:var(--shadow);
}
.peta-center-box .display{font-size:1.3rem;line-height:1.25;}
.peta-corner{
  background:#fff;border-radius:20px;padding:22px 22px;box-shadow:var(--shadow);
  cursor:pointer;transition:transform .2s,box-shadow .2s;border:2px solid var(--line);
  text-align:left;
}
.peta-corner:hover,.peta-corner:focus-visible{transform:translateY(-5px);box-shadow:0 16px 34px -14px rgba(23,59,76,.28);outline:none;}
.peta-corner.c-green{background:#F1FAF2;border-color:#BFE3C9;}
.peta-corner.c-orange{background:#FFF8EC;border-color:#FFE1A8;}
.peta-corner.c-purple{background:#F8F2FC;border-color:#E3D3F5;}
.peta-corner.c-blue{background:#EEF8FD;border-color:#BFE3F5;}
.peta-circle{
  width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:1.5rem;color:#fff;margin-bottom:12px;box-shadow:0 6px 14px -6px rgba(0,0,0,.25);
}
.peta-circle.bg-green{background:#4CAF6C;}
.peta-circle.bg-orange{background:#F5A623;}
.peta-circle.bg-purple{background:#9B6FD6;}
.peta-circle.bg-blue{background:#3D8FC4;}
.peta-corner h4{font-size:1.08rem;margin-bottom:8px;}
.peta-corner .underline-dots{border-top:2px dotted currentColor;width:60%;margin:4px 0 10px;opacity:.5;}
.peta-corner p{font-size:.86rem;color:#4A5D57;margin:0;}
.peta-corner .go{margin-top:12px;font-weight:800;font-size:.82rem;color:var(--blue-deep);}
.peta-cell-tl{grid-column:1;grid-row:1;} .peta-cell-tr{grid-column:3;grid-row:1;}
.peta-cell-bl{grid-column:1;grid-row:3;} .peta-cell-br{grid-column:3;grid-row:3;}
@media (max-width:880px){
  .peta-map-grid{display:flex;flex-direction:column;gap:16px;}
  .peta-map svg.connectors{display:none;}
  .peta-center-cell{order:0;}
  .peta-corner{width:100%;}
}
.peta-nodes{display:none;}

/* MISI cards */
.misi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;}
.misi-card{
  background:#fff;border-radius:var(--radius);border:1.5px solid var(--line);
  padding:26px 22px;display:flex;flex-direction:column;gap:12px;
  transition:transform .2s,box-shadow .2s;position:relative;
}
.misi-card:hover{transform:translateY(-6px);box-shadow:var(--shadow);}
.misi-top{display:flex;justify-content:space-between;align-items:flex-start;}
.misi-num{font-family:'Baloo 2';font-weight:800;color:var(--green-soft);font-size:1.4rem;}
.misi-icon{font-size:2rem;}
.misi-card h3{font-size:1.1rem;}
.misi-card p{color:#5A6B65;font-size:.92rem;flex:1;}
.mini-progress{height:8px;background:var(--green-pale);border-radius:999px;overflow:hidden;}
.mini-progress-fill{height:100%;background:var(--green-deep);border-radius:999px;transition:width .3s;}
.misi-status{font-size:.78rem;font-weight:800;color:var(--green-deep);}
@media (max-width:980px){.misi-grid{grid-template-columns:1fr 1fr;}}
@media (max-width:560px){.misi-grid{grid-template-columns:1fr;}}

/* GLOSARIUM accordion */
.glos-list{display:flex;flex-direction:column;gap:10px;max-width:820px;margin:0 auto;}
.glos-item{background:#fff;border:1.5px solid var(--line);border-radius:14px;overflow:hidden;}
.glos-q{
  width:100%;text-align:left;background:none;border:none;padding:16px 20px;
  display:flex;justify-content:space-between;align-items:center;font-weight:800;color:var(--blue-deep);font-size:1rem;
}
.glos-q:hover{background:var(--green-pale);}
.glos-a{max-height:0;overflow:hidden;transition:max-height .25s ease;padding:0 20px;color:#4A5D57;}
.glos-item.open .glos-a{max-height:200px;padding:0 20px 18px;}
.glos-item.open .glos-q{color:var(--green-deep);}
.chev{transition:transform .2s;}
.glos-item.open .chev{transform:rotate(180deg);}

/* FOOTER */
footer{background:var(--blue-deep);color:#DCE9EC;padding:56px 0 26px;margin-top:40px;}
.footer-top{display:flex;justify-content:space-between;flex-wrap:wrap;gap:30px;}
footer h3{color:#fff;}
footer .foot-tag{color:#A9C2C9;margin-top:8px;max-width:320px;}
.foot-nav{display:flex;gap:22px;flex-wrap:wrap;}
.foot-nav a,.foot-nav button{background:none;border:none;color:#DCE9EC;font-weight:700;font-family:inherit;font-size:.95rem;}
.foot-nav button:hover{color:var(--yellow);}
.foot-msg{margin-top:30px;padding-top:24px;border-top:1px solid rgba(255,255,255,.15);text-align:center;color:#A9C2C9;font-style:italic;}
.foot-copy{text-align:center;margin-top:14px;color:#7E97A0;font-size:.85rem;}

/* PAGE HEADER for inner pages */
.page-hero{
  padding:44px 0 40px;background:linear-gradient(160deg,var(--green-pale),var(--cream));
  border-bottom:1.5px solid var(--line);
}
.breadcrumb{display:flex;gap:8px;align-items:center;font-size:.88rem;color:#5A6B65;margin-bottom:16px;flex-wrap:wrap;}
.breadcrumb button{background:none;border:none;font-weight:800;color:var(--green-deep);font-family:inherit;}
.page-hero h1{font-size:2.1rem;}
.page-hero .sub{color:#3E534C;margin-top:8px;max-width:640px;}
.page-badges{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap;}
.back-row{margin-top:20px;}

/* CARDS generic */
.card{background:#fff;border:1.5px solid var(--line);border-radius:var(--radius);padding:26px;}
.card + .card{margin-top:20px;}
.card h3{font-size:1.2rem;margin-bottom:10px;}
.card h4{font-size:1.02rem;color:var(--green-deep);margin-bottom:8px;}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
@media (max-width:760px){.two-col{grid-template-columns:1fr;}}

.formula{
  background:var(--blue-deep);color:#fff;border-radius:14px;padding:16px 22px;
  font-family:'Baloo 2';font-size:1.15rem;text-align:center;margin:14px 0;letter-spacing:.02em;
}
.formula.light{background:var(--green-pale);color:var(--blue-deep);border:1.5px dashed var(--green-soft);}

table.matter{width:100%;border-collapse:collapse;margin:14px 0;font-size:.92rem;}
table.matter th,table.matter td{border:1px solid var(--line);padding:10px 12px;text-align:center;}
table.matter th{background:var(--green-pale);color:var(--blue-deep);}

.field-label{font-weight:800;color:var(--blue-deep);font-size:.92rem;margin:14px 0 6px;display:block;}
input[type=text],input[type=number],textarea{
  width:100%;padding:12px 14px;border-radius:10px;border:1.5px solid var(--line);
  font-family:inherit;font-size:1rem;background:#FCFBF7;
}
textarea{min-height:80px;resize:vertical;}
input:focus,textarea:focus{outline:3px solid var(--blue-sky);outline-offset:1px;border-color:var(--blue-sky);}
.mc-options{display:flex;flex-direction:column;gap:8px;margin-top:6px;}
.mc-option{display:flex;align-items:center;gap:10px;padding:10px 14px;border:1.5px solid var(--line);border-radius:10px;cursor:pointer;}
.mc-option:hover{border-color:var(--blue-sky);}
.mc-option input{width:18px;height:18px;}

.feedback{
  margin-top:14px;padding:14px 18px;border-radius:12px;font-weight:700;display:none;align-items:center;gap:10px;
}
.feedback.show{display:flex;}
.feedback.ok{background:var(--green-pale);color:var(--green-deep);border:1.5px solid var(--green-soft);}
.feedback.bad{background:var(--coral-pale);color:#C24A34;border:1.5px solid #FFC7B8;}

.hint-box{margin-top:12px;background:#FFF7E0;border:1.5px solid var(--yellow);border-radius:12px;padding:12px 16px;color:#6B5100;font-weight:600;display:none;}
.hint-box.show{display:block;}

.step-actions{display:flex;gap:12px;margin-top:20px;flex-wrap:wrap;}

/* stepper tracker (pemodelan / sifat) */
.tracker{display:flex;gap:6px;flex-wrap:wrap;margin:22px 0 6px;}
.tracker .dot{
  flex:1;min-width:90px;text-align:center;padding:10px 6px;border-radius:10px;font-size:.75rem;font-weight:800;
  background:#fff;border:1.5px solid var(--line);color:#8A9A94;
}
.tracker .dot.done{background:var(--green-deep);color:#fff;border-color:var(--green-deep);}
.tracker .dot.current{background:var(--yellow);color:#6B5100;border-color:var(--yellow);}

.check-row{display:flex;align-items:flex-start;gap:10px;padding:8px 0;}
.check-row input{width:20px;height:20px;margin-top:2px;}

.pembahasan{
  margin-top:14px;background:var(--green-pale);border-radius:12px;padding:16px 18px;display:none;
}
.pembahasan.show{display:block;}

.pill-select{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px;}
.pill-select label{
  border:1.5px solid var(--line);border-radius:999px;padding:8px 16px;font-weight:700;font-size:.88rem;
  display:flex;align-items:center;gap:6px;cursor:pointer;
}
.pill-select input{width:16px;height:16px;}

.toast{
  position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--blue-deep);color:#fff;padding:14px 26px;border-radius:999px;
  font-weight:700;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.3s ease;z-index:999;
  display:flex;align-items:center;gap:10px;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

.tooltip-wrap{position:relative;display:inline-flex;}
.tooltip-wrap .tip{
  visibility:hidden;opacity:0;position:absolute;bottom:130%;left:50%;transform:translateX(-50%);
  background:var(--blue-deep);color:#fff;padding:6px 10px;border-radius:8px;font-size:.75rem;white-space:nowrap;
  transition:.15s;
}
.tooltip-wrap:hover .tip{visibility:visible;opacity:1;}

/* profil */
.profil-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:20px;}
.profil-card{background:#fff;border-radius:var(--radius);border:1.5px solid var(--line);padding:22px 18px;text-align:center;transition:transform .2s;}
.profil-card:hover{transform:translateY(-5px);box-shadow:var(--shadow);}
.profil-photo{
  width:88px;height:88px;border-radius:50%;margin:0 auto 14px;
  background:linear-gradient(160deg,var(--green-soft),var(--blue-sky));
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:2rem;
}
.profil-card h4{font-size:1rem;}
.profil-card .role{color:var(--green-deep);font-weight:800;font-size:.82rem;margin:4px 0 8px;}
.profil-card p{font-size:.85rem;color:#5A6B65;}
@media (max-width:980px){.profil-grid{grid-template-columns:repeat(3,1fr);}}
@media (max-width:620px){.profil-grid{grid-template-columns:1fr 1fr;}}

/* problem block for pemodelan */
.story-box{background:var(--green-pale);border-radius:14px;padding:20px 22px;border:1.5px dashed var(--green-soft);font-size:.98rem;color:#2F4A41;}
.story-box p{margin:0 0 10px;}
.story-box p:last-child{margin-bottom:0;}
.task-item{border-top:1px solid var(--line);padding:16px 0;}
.task-item:first-child{border-top:none;}
.task-num{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:var(--blue-deep);color:#fff;font-size:.8rem;font-weight:800;margin-right:8px;}

/* animations */
.fade-in{opacity:1;transform:translateY(0);transition:opacity .5s ease, transform .5s ease;}
.fade-in.pre{opacity:0;transform:translateY(16px);}
.fade-in.pre.visible{opacity:1;transform:translateY(0);}
.bounce-check{display:inline-block;animation:pop .4s ease;}

/* ============ PROGRESS / STORAGE ============ */
const STORE_KEY = "aljabarcinta_progress_v2";
function loadProgress(){
  try{ return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; }catch(e){ return {}; }
}
function saveProgress(p){ localStorage.setItem(STORE_KEY, JSON.stringify(p)); }
let progress = loadProgress();

const MISI_LIST = ["unsur","operasi","sifat","pemodelan"];
function setMisiStep(misi, stepKey, value){
  progress[misi] = progress[misi] || {};
  progress[misi][stepKey] = value;
  saveProgress(progress);
  updateGlobalProgress();
}
function getMisiPercent(misi, totalSteps){
  const done = progress[misi] ? Object.values(progress[misi]).filter(Boolean).length : 0;
  return Math.round((done/totalSteps)*100);
}
const MISI_TOTALS = { unsur:4, operasi:4, sifat:4, pemodelan:7 };
const MATERI_TOTALS = { materiUnsur:3, materiOperasi:4 };
function updateGlobalProgress(){
  let totalDone = 0, totalAll = 0;
  MISI_LIST.forEach(m=>{
    const t = MISI_TOTALS[m];
    totalAll += t;
    totalDone += progress[m] ? Object.values(progress[m]).filter(Boolean).length : 0;
  });
  const pct = totalAll? Math.round((totalDone/totalAll)*100) : 0;
  document.getElementById('progressFill').style.width = pct + '%';
}
function showToast(msg){
  const t = document.getElementById('toast');
  document.getElementById('toastText').textContent = msg;
  t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(()=>t.classList.remove('show'), 2600);
}

/* ============ RENDER ROUTER ============ */
function render(){
  const hash = location.hash.replace('#','') || 'beranda';
  const [page, sub] = hash.split('/');
  const main = document.getElementById('main');
  window.scrollTo({top:0, behavior:'instant' in window ? 'instant':'auto'});
  setActiveNav(page);
  updateGlobalProgress();

  if(page==='beranda') main.innerHTML = pageBeranda();
  else if(page==='pilihan') main.innerHTML = pagePilihan();
  else if(page==='petunjuk') main.innerHTML = pagePetunjuk();
  else if(page==='materi-peta') main.innerHTML = pageMateriPeta();
  else if(page==='materi-unsur') main.innerHTML = pageMateriUnsur();
  else if(page==='materi-operasi') main.innerHTML = pageMateriOperasi();
  else if(page==='materi-sifat') main.innerHTML = pageMateriSifat();
  else if(page==='misi-peta') main.innerHTML = pageMisiPeta();
  else if(page==='misi-unsur') main.innerHTML = pageMisiUnsur(sub? parseInt(sub):1);
  else if(page==='misi-operasi') main.innerHTML = pageMisiOperasi(sub? parseInt(sub):1);
  else if(page==='misi-sifat') main.innerHTML = pageSifat(sub? parseInt(sub):1);
  else if(page==='misi-pemodelan') main.innerHTML = pagePemodelan(sub || null);
  else if(page==='profil') main.innerHTML = pageProfil();
  else main.innerHTML = pageBeranda();

  afterRender(page, sub);
  observeFadeIns();
}

function observeFadeIns(){
  const els = document.querySelectorAll('.fade-in');
  els.forEach(el=>el.classList.add('pre'));
  const io = new IntersectionObserver((entries)=>{
    entries.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('visible'); io.unobserve(e.target);} });
  },{threshold:.05});
  els.forEach(el=>io.observe(el));
  /* jaring pengaman: pastikan konten tetap tampil walau observer gagal/telat (mis. saat screenshot/print) */
  clearTimeout(window._fadeSafety);
  window._fadeSafety = setTimeout(()=>{ els.forEach(el=>el.classList.add('visible')); }, 1000);
}

function glosariumHTML(limit){

  return `<div class="glos-list">

        </button>
        <div class="glos-a"><p>${g[1]}</p></div>

/* Pemeriksa bentuk aljabar yang fleksibel: menerima urutan suku berbeda,
   spasi, tanda kali eksplisit/implisit, selama nilainya (secara struktur) sama. */
function canonicalAlg(input){
  if(input===undefined || input===null) return null;
  let s = String(input).toLowerCase().replace(/\s+/g,'')
    .replace(/−/g,'-').replace(/×/g,'*').replace(/\*/g,'')
    .replace(/²/g,'^2');
  if(s==='') return null;
  if(!/^[+-]/.test(s)) s = '+'+s;
  const terms = s.match(/[+-][^+-]+/g) || [];
  const vars = {};
  let constant = 0;
  let valid = true;
  terms.forEach(t=>{
    const sign = t[0]==='-' ? -1 : 1;
    const body = t.slice(1);
    const m = body.match(/^(\d*\.?\d*)([a-z])(\^2)?$/);
    if(m){
      const coef = m[1]==='' ? 1 : parseFloat(m[1]);
      const key = m[2] + (m[3] ? '^2' : '');
      vars[key] = (vars[key]||0) + sign*coef;
    } else if(/^\d*\.?\d+$/.test(body)){
      constant += sign*parseFloat(body);
    } else if(body!==''){
      valid = false;
    }
  });
  if(!valid) return null;
  const keys = Object.keys(vars).filter(k=>vars[k]!==0).sort();
  return keys.map(k=>`${vars[k]}${k}`).join(',') + `|${constant}`;
}
function algEquals(userAnswer, correctAnswer){
  const u = canonicalAlg(userAnswer);
  const c = canonicalAlg(correctAnswer);
  if(u===null) return false;
  return u === c;
}

function sifatTracker(current){
  const labels = ["1. Kotak Pilah","2. Coba & Temukan","3. Hitung Cepat","4. Refleksi"];
  return `<div class="tracker">${labels.map((l,i)=>`<div class="dot ${i+1<current?'done':i+1===current?'current':''}">${l}</div>`).join('')}</div>`;
}
function pageSifat(step){
  step = step>=1 && step<=4 ? step : 1;
  let body = '';
  if(step===1) body = sifatPage1();
  else if(step===2) body = sifatPage2();
  else if(step===3) body = sifatPage3();
  else body = sifatPage4();
  return `
  ${misiHeader({title:"💚 Misi Kotak Pilah Sampah Mini", badge:'<span class="badge blue">Sifat Aljabar</span>', sub:'"Kelasku Bersih, Bumiku Sehat" — Materi: Sifat Komutatif, Asosiatif, dan Distributif. Kelas VII SMP, kegiatan kelompok 4–5 siswa.', breadcrumbLast:"Misi Sifat"})}
  <section>
    <div class="wrap" style="max-width:880px;">
      ${sifatTracker(step)}
      ${body}
    </div>
  </section>`;
}

  <div class="card fade-in" style="background:var(--green-pale);border:none;">
    <h4>🌟 Kesimpulan Utama</h4>
    <p>Sifat komutatif, asosiatif, dan distributif dapat digunakan untuk mengubah bentuk aljabar menjadi bentuk lain yang ekuivalen tanpa mengubah nilainya. Bentuk yang dipilih dapat disesuaikan agar perhitungan dan penyelesaian masalah menjadi lebih mudah.</p>
  </div>
  <div class="card fade-in">
    <h3>❤️ Refleksi Cinta Lingkungan</h3>
    <p>Tuliskan satu kebiasaan sederhana yang dapat kalian lakukan untuk mengurangi sampah di kelas.</p>
    <textarea id="s4-refleksi" placeholder="Tuliskan refleksimu di sini..."></textarea>
    <p style="margin-top:14px;font-style:italic;color:var(--green-deep);font-weight:700;">"Pilah sampah dengan bijak, susun aljabar dengan tepat."</p>
    <div class="step-actions">
      <button class="btn btn-outline" onclick="go('misi-sifat','3')">← Kembali</button>
      <button class="btn btn-coral" onclick="sifatFinish()">✓ SELESAI</button>
    </div>
    <div id="s4-done"></div>
  </div>`;
}
function sifatFinish(){
  setMisiStep('sifat','p4',true);
  document.getElementById('s4-done').innerHTML = `
    <div class="done-anim fade-in visible">
      <div class="big-emoji">🌍🍃⭐</div>
      <p style="font-weight:800;color:var(--green-deep);">Misi Sifat Aljabar selesai! Terima kasih sudah peduli lingkungan.</p>
      <div class="step-actions" style="justify-content:center;">
         <button class="btn btn-outline" onclick="go('materi-sifat')">📘 Pelajari Materi Sifat</button>
         <button class="btn btn-primary" onclick="go('misi-pemodelan')">Lanjut ke Misi Pemodelan →</button>
       </div>
    </div>`;
  showToast('Misi Sifat Aljabar selesai! 🎉');
}

/* ============ PAGE: MISI PEMODELAN ============ */
function pagePemodelan(sub){
  if(!sub){
    return `
    ${misiHeader({title:"🌍 Misi Pemodelan", sub:"Memodelkan Masalah Cinta Lingkungan dengan Bentuk Aljabar", breadcrumbLast:"Misi Pemodelan"})}
    <section>
      <div class="wrap">
        ${illustrationCard(bankSampahSVG(), "Dari bank sampah, taman, air, hingga soal bentuk aljabar — semua bisa diselesaikan dengan langkah pemodelan yang runtut.")}
        <div class="card fade-in">
          <h3>📚 Pola Pemodelan yang Digunakan</h3>
          <p>Untuk setiap permasalahan, gunakan langkah-langkah berikut:</p>
          <div class="tracker">${POLA_STEPS.map((s,i)=>`<div class="dot">${i+1}. ${s}</div>`).join('')}</div>
        </div>
        <div class="misi-grid" style="margin-top:10px;">
          ${PEMODELAN.map((p,i)=>{
            const done = progress.pemodelan && progress.pemodelan[p.id];
            return `<div class="misi-card fade-in">
              <div class="misi-top"><span class="misi-num">0${i+1}</span><span class="misi-icon">${p.emoji}</span></div>
              <h3>${p.title}</h3>
              <p>${p.tasks.length} tugas interaktif berbasis cerita nyata.</p>
              <div class="misi-status">${done?'✓ Selesai':'Belum selesai'}</div>
              <button class="btn btn-primary btn-sm" onclick="go('misi-pemodelan','${p.id}')">${done?'Lihat Kembali →':'Mulai →'}</button>
            </div>`;
          }).join('')}
        </div>
      </div>
    </section>`;
  }
  const problem = PEMODELAN.find(p=>p.id===sub);
  if(!problem) return pagePemodelan(null);
  const idx = PEMODELAN.indexOf(problem);
  return `
  ${misiHeader({title:`${problem.emoji} ${problem.title}`, badge:'<span class="badge blue">Pemodelan</span>', sub:'Ikuti 7 langkah pemodelan untuk menyelesaikan masalah ini.', breadcrumbLast:"Misi Pemodelan"})}
  <section>
    <div class="wrap" style="max-width:880px;">
      <div class="card fade-in">
        <h3>📖 Cerita</h3>
        <div class="story-box">${problem.story.map(p=>`<p>${p}</p>`).join('')}</div>
      </div>
      <div class="card fade-in">
        <h3>✏️ Tugas Kalian</h3>
        ${problem.tasks.map((t,i)=>`
          <div class="task-item">
            <p><span class="task-num">${i+1}</span>${t}</p>
            <textarea id="pm-${problem.id}-${i}" placeholder="Tuliskan jawabanmu di sini..."></textarea>
          </div>`).join('')}
        <div class="feedback" id="pm-fb-${problem.id}"></div>
        <div class="step-actions">
          <button class="btn btn-outline" onclick="go('misi-pemodelan')">← Semua Permasalahan</button>
          <button class="btn btn-coral" onclick="pemodelanFinish('${problem.id}')">✓ SELESAIKAN MISI INI</button>
          ${problem.materi?`<button class="btn btn-outline" onclick="go('${problem.materi}')">📘 Pelajari Materi Lebih Lanjut</button>`:''}
          ${idx<PEMODELAN.length-1?`<button class="btn btn-primary" onclick="go('misi-pemodelan','${PEMODELAN[idx+1].id}')">Permasalahan Berikutnya →</button>`:`<button class="btn btn-primary" onclick="go('misi-pemodelan')">Kembali ke Daftar Misi →</button>`}
        </div>
        <div id="pm-done-${problem.id}"></div>
      </div>
    </div>
  </section>`;
}
function pemodelanFinish(id){
  const problem = PEMODELAN.find(p=>p.id===id);
  const filled = problem.tasks.every((t,i)=>document.getElementById(`pm-${id}-${i}`).value.trim()!=='');
  const fb = document.getElementById(`pm-fb-${id}`);
  if(!filled){
    fb.className='feedback bad show';
    fb.textContent='Yuk isi dulu semua jawaban tugas sebelum menyelesaikan misi ini.';
    return;
  }
  fb.className='feedback ok show';
  fb.innerHTML='<span class="bounce-check">✓</span> Semua tugas terisi. Kerja bagus!';
  setMisiStep('pemodelan', id, true);
  showToast('Progress Misi Pemodelan tersimpan! 🌍');
  document.getElementById(`pm-done-${id}`).innerHTML = `
    <div class="done-anim fade-in visible"><div class="big-emoji">🌱⭐🌍</div>
    <p style="font-weight:800;color:var(--green-deep);">Permasalahan selesai! Aljabar membantumu memahami masalah lingkungan lebih baik.</p></div>`;
}

/* ============ AFTER RENDER HOOKS ============ */
function afterRender(page, sub){
  updateGlobalProgress();
}

/* init */
render();
</script>
</body>
</html>
