<!doctype html>
<!--
ALJABAR CINTA — BERKAS UTAMA

PANDUAN EDIT SINGKAT (gunakan Ctrl+F untuk mencari kata berikut):
1. PEMODELAN            : judul, ikon, cerita, dan tugas pada 12 kartu.
2. PEMODELAN_KUNCI      : jawaban hitungan dan hasil substitusi.
3. PENGEMBANG           : nama serta peran pengembang.
4. pageSifatMenu        : gambar pada kartu menu sifat aljabar.
5. nativeConclusion    : kolom kesimpulan siswa.
6. :root               : warna utama website.

Tautan Google Form diatur dalam konfigurasi.js.
Gambar disimpan di folder assets; pertahankan nama dan struktur foldernya.
Jangan mengubah id soal (p1–p12) agar jawaban tersimpan tetap terhubung.
Bagian CSS mengatur tampilan. Bagian JavaScript mengatur isi dan interaksi.
Buat salinan cadangan sebelum mengedit, lalu buka index.html untuk memeriksa.
-->
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aljabar Cinta — Belajar Bentuk Aljabar dan Memecahkan Masalah</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:ital,wght@0,400;0,500;0,600;0,700;0,800;1,600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --green-deep: #2e7d4f;
        --green-soft: #8fd6a0;
        --green-pale: #eaf7ec;
        --blue-sky: #5fb6e5;
        --blue-deep: #173b4c;
        --cream: #fbf7ec;
        --yellow: #ffd873;
        --coral: #ff8f7a;
        --coral-pale: #ffede9;
        --ink: #1f3b33;
        --line: #e3dfd1;
        --white: #ffffff;
        --shadow: 0 10px 30px -12px rgba(23, 59, 76, 0.18);
        --radius: 20px;
        --radius-sm: 12px;
      }
      * {
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        margin: 0;
        font-family: "Nunito", sans-serif;
        background: var(--cream);
        color: var(--ink);
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
      }
      h1,
      h2,
      h3,
      h4,
      .display {
        font-family: "Baloo 2", cursive;
        color: var(--blue-deep);
        margin: 0;
        line-height: 1.15;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      button {
        font-family: inherit;
        cursor: pointer;
      }
      img {
        max-width: 100%;
        display: block;
      }
      .wrap {
        max-width: 1180px;
        margin: 0 auto;
        padding: 0 24px;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 0.78rem;
        font-weight: 800;
        letter-spacing: 0.03em;
        padding: 6px 14px;
        border-radius: 999px;
        background: var(--green-pale);
        color: var(--green-deep);
        border: 1.5px solid var(--green-soft);
      }
      .badge.coral {
        background: var(--coral-pale);
        color: #c24a34;
        border-color: #ffc7b8;
      }
      .badge.blue {
        background: #e9f5fc;
        color: #1b5e82;
        border-color: #bfe3f5;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 14px 26px;
        border-radius: 999px;
        border: none;
        font-weight: 800;
        font-size: 1rem;
        font-family: "Baloo 2", cursive;
        transition:
          transform 0.15s ease,
          box-shadow 0.15s ease,
          background 0.15s ease;
        box-shadow: 0 8px 20px -8px rgba(46, 125, 79, 0.5);
      }
      .btn:focus-visible {
        outline: 3px solid var(--blue-deep);
        outline-offset: 3px;
      }
      .btn:active {
        transform: translateY(1px);
      }
      .btn-primary {
        background: var(--green-deep);
        color: #fff;
      }
      .btn-primary:hover {
        background: #256a42;
        transform: translateY(-2px);
      }
      .btn-outline {
        background: #fff;
        color: var(--blue-deep);
        border: 2px solid var(--blue-deep);
        box-shadow: none;
      }
      .btn-outline:hover {
        background: var(--blue-deep);
        color: #fff;
      }
      .btn-coral {
        background: var(--coral);
        color: #fff;
        box-shadow: 0 8px 20px -8px rgba(255, 143, 122, 0.6);
      }
      .btn-coral:hover {
        background: #f4735c;
        transform: translateY(-2px);
      }
      .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        transform: none;
      }
      .btn-sm {
        padding: 9px 16px;
        font-size: 0.88rem;
      }

      /* NAVBAR */
      #navbar {
        position: sticky;
        top: 0;
        z-index: 100;
        background: rgba(251, 247, 236, 0.92);
        backdrop-filter: blur(8px);
        border-bottom: 1.5px solid var(--line);
        transition: box-shadow 0.2s ease;
      }
      #navbar.scrolled {
        box-shadow: 0 4px 20px -8px rgba(23, 59, 76, 0.25);
      }
      .nav-inner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 24px;
        max-width: 1180px;
        margin: 0 auto;
      }
      .logo {
        display: flex;
        align-items: center;
        gap: 10px;
        font-family: "Baloo 2";
        font-weight: 800;
        font-size: 1.25rem;
        color: var(--blue-deep);
      }
      .logo-mark {
        width: 40px;
        height: 40px;
        border-radius: 12px;
        background: linear-gradient(145deg, var(--green-deep), var(--green-soft));
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-size: 1.2rem;
        font-weight: 800;
        box-shadow: 0 6px 14px -6px rgba(46, 125, 79, 0.6);
        position: relative;
      }
      .logo-mark svg {
        width: 24px;
        height: 24px;
      }
      .nav-links {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .nav-links button {
        background: none;
        border: none;
        padding: 10px 16px;
        border-radius: 999px;
        font-weight: 700;
        color: var(--blue-deep);
        font-size: 0.96rem;
        transition:
          background 0.15s,
          color 0.15s;
      }
      .nav-links button:hover,
      .nav-links button.active {
        background: var(--green-pale);
        color: var(--green-deep);
      }
      .nav-cta {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .hamburger {
        display: none;
        background: none;
        border: none;
        padding: 8px;
      }
      .hamburger span {
        display: block;
        width: 24px;
        height: 3px;
        background: var(--blue-deep);
        margin: 5px 0;
        border-radius: 3px;
        transition: 0.2s;
      }
      #mobileMenu {
        display: none;
        flex-direction: column;
        gap: 4px;
        padding: 10px 20px 18px;
        background: var(--cream);
        border-bottom: 1.5px solid var(--line);
      }
      #mobileMenu.open {
        display: flex;
      }
      #mobileMenu button {
        text-align: left;
        background: none;
        border: none;
        padding: 12px 10px;
        font-weight: 700;
        color: var(--blue-deep);
        font-size: 1rem;
        border-radius: 10px;
      }
      #mobileMenu button:hover {
        background: var(--green-pale);
      }

      @media (max-width: 880px) {
        .nav-links {
          display: none;
        }
        .hamburger {
          display: block;
        }
        .nav-cta .btn span.long {
          display: none;
        }
      }

      /* progress mini bar under nav */
      #progressStrip {
        height: 5px;
        background: var(--line);
        position: relative;
      }
      #progressFill {
        height: 100%;
        background: linear-gradient(90deg, var(--green-deep), var(--green-soft));
        width: 0%;
        transition: width 0.4s ease;
      }

      /* SECTIONS */
      section {
        padding: 88px 0;
      }
      .section-head {
        text-align: center;
        max-width: 640px;
        margin: 0 auto 48px;
      }
      .eyebrow {
        font-weight: 800;
        color: var(--coral);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        font-size: 0.82rem;
      }
      .section-head h2 {
        font-size: 2.1rem;
        margin-top: 8px;
      }
      .section-head p {
        color: #4a5d57;
        margin-top: 12px;
        font-size: 1.05rem;
      }

      /* HERO */
      #hero {
        padding: 60px 0 90px;
        background:
          radial-gradient(circle at 85% 10%, rgba(255, 216, 115, 0.35), transparent 45%),
          radial-gradient(circle at 8% 85%, rgba(95, 182, 229, 0.22), transparent 45%), var(--cream);
        position: relative;
        overflow: hidden;
      }
      .hero-grid {
        display: grid;
        grid-template-columns: 1.1fr 0.9fr;
        gap: 48px;
        align-items: center;
      }
      .hero-copy h1 {
        font-size: 3.4rem;
        letter-spacing: -0.01em;
      }
      .hero-tagline {
        font-size: 1.25rem;
        font-weight: 700;
        color: var(--green-deep);
        margin-top: 14px;
      }
      .hero-sub {
        margin-top: 8px;
        font-weight: 800;
        color: var(--blue-deep);
        font-size: 1rem;
      }
      .hero-desc {
        margin-top: 18px;
        color: #3e534c;
        font-size: 1.05rem;
        max-width: 480px;
      }
      .hero-actions {
        display: flex;
        gap: 14px;
        margin-top: 30px;
        flex-wrap: wrap;
      }
      .hero-badges {
        display: flex;
        gap: 10px;
        margin-top: 26px;
        flex-wrap: wrap;
      }
      .hero-visual {
        position: relative;
      }
      .hero-illustration {
        background: linear-gradient(160deg, #dcf3e1, #e8f6fb);
        border-radius: 28px;
        padding: 34px;
        position: relative;
        box-shadow: var(--shadow);
        border: 2px solid #fff;
      }
      .floaty {
        position: absolute;
        animation: float 5s ease-in-out infinite;
      }
      @keyframes float {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-12px);
        }
      }
      .leaf1 {
        top: -18px;
        left: -18px;
        font-size: 2.4rem;
        animation-delay: 0s;
      }
      .leaf2 {
        bottom: -14px;
        right: -10px;
        font-size: 2rem;
        animation-delay: 1.2s;
      }
      .heart-float {
        top: 10px;
        right: 20px;
        font-size: 1.6rem;
        animation-delay: 0.6s;
      }

      @media (max-width: 880px) {
        .hero-grid {
          grid-template-columns: 1fr;
        }
        .hero-copy h1 {
          font-size: 2.4rem;
        }
      }

      /* VALUE CARDS (cinta lingkungan) */
      .value-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 24px;
      }
      .value-card {
        background: #fff;
        border-radius: var(--radius);
        padding: 30px 24px;
        text-align: center;
        border: 1.5px solid var(--line);
        transition:
          transform 0.2s ease,
          box-shadow 0.2s ease;
      }
      .value-card:hover {
        transform: translateY(-6px);
        box-shadow: var(--shadow);
      }
      .value-icon {
        font-size: 2.4rem;
        margin-bottom: 14px;
      }
      .value-card h3 {
        font-size: 1.15rem;
      }
      .value-card p {
        color: #5a6b65;
        font-size: 0.95rem;
        margin-top: 8px;
      }

      /* TUJUAN CARDS */
      .goal-grid {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 18px;
      }
      .goal-card {
        background: #fff;
        border-radius: var(--radius-sm);
        padding: 22px 18px;
        border: 1.5px solid var(--line);
        position: relative;
        overflow: hidden;
        transition:
          transform 0.2s ease,
          box-shadow 0.2s;
      }
      .goal-card:hover {
        transform: translateY(-5px);
        box-shadow: var(--shadow);
        border-color: var(--green-soft);
      }
      .goal-num {
        font-family: "Baloo 2";
        font-size: 1.6rem;
        color: var(--green-soft);
        font-weight: 800;
      }
      .goal-icon {
        font-size: 1.8rem;
        margin: 8px 0 10px;
      }
      .goal-card p {
        font-size: 0.88rem;
        color: #3e534c;
      }
      @media (max-width: 980px) {
        .goal-grid {
          grid-template-columns: repeat(2, 1fr);
        }
        .value-grid {
          grid-template-columns: 1fr;
        }
      }
      @media (min-width: 981px) and (max-width: 1180px) {
        .goal-grid {
          grid-template-columns: repeat(3, 1fr);
        }
      }

      /* PETA KONSEP */
      #peta {
        background: var(--white);
      }
      .peta-diagram {
        display: none;
      }
      .peta-root {
        background: var(--blue-deep);
        color: #fff;
        padding: 16px 34px;
        border-radius: 16px;
        font-family: "Baloo 2";
        font-weight: 700;
        font-size: 1.15rem;
        box-shadow: var(--shadow);
      }
      .peta-line {
        width: 2px;
        height: 34px;
        background: var(--line);
      }
      /* PETA KONSEP - layout kartu sudut + panah, meniru referensi */
      .peta-map {
        position: relative;
        max-width: 940px;
        margin: 0 auto;
      }
      .peta-map svg.connectors {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
        pointer-events: none;
      }
      .peta-map-grid {
        position: relative;
        z-index: 2;
        display: grid;
        grid-template-columns: 1fr 220px 1fr;
        grid-template-rows: auto 40px auto;
        align-items: center;
        gap: 0 18px;
      }
      .peta-center-cell {
        grid-column: 2;
        grid-row: 1/4;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .peta-center-box {
        background: #e4f1fb;
        border: 2px solid #bfe3f5;
        border-radius: 20px;
        padding: 26px 22px;
        text-align: center;
        box-shadow: var(--shadow);
      }
      .peta-center-box .display {
        font-size: 1.3rem;
        line-height: 1.25;
      }
      .peta-corner {
        background: #fff;
        border-radius: 20px;
        padding: 22px 22px;
        box-shadow: var(--shadow);
        cursor: pointer;
        transition:
          transform 0.2s,
          box-shadow 0.2s;
        border: 2px solid var(--line);
        text-align: left;
      }
      .peta-corner:hover,
      .peta-corner:focus-visible {
        transform: translateY(-5px);
        box-shadow: 0 16px 34px -14px rgba(23, 59, 76, 0.28);
        outline: none;
      }
      .peta-corner.c-green {
        background: #f1faf2;
        border-color: #bfe3c9;
      }
      .peta-corner.c-orange {
        background: #fff8ec;
        border-color: #ffe1a8;
      }
      .peta-corner.c-purple {
        background: #f8f2fc;
        border-color: #e3d3f5;
      }
      .peta-corner.c-blue {
        background: #eef8fd;
        border-color: #bfe3f5;
      }
      .peta-circle {
        width: 52px;
        height: 52px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.5rem;
        color: #fff;
        margin-bottom: 12px;
        box-shadow: 0 6px 14px -6px rgba(0, 0, 0, 0.25);
      }
      .peta-circle.bg-green {
        background: #4caf6c;
      }
      .peta-circle.bg-orange {
        background: #f5a623;
      }
      .peta-circle.bg-purple {
        background: #9b6fd6;
      }
      .peta-circle.bg-blue {
        background: #3d8fc4;
      }
      .peta-corner h4 {
        font-size: 1.08rem;
        margin-bottom: 8px;
      }
      .peta-corner .underline-dots {
        border-top: 2px dotted currentColor;
        width: 60%;
        margin: 4px 0 10px;
        opacity: 0.5;
      }
      .peta-corner p {
        font-size: 0.86rem;
        color: #4a5d57;
        margin: 0;
      }
      .peta-corner .go {
        margin-top: 12px;
        font-weight: 800;
        font-size: 0.82rem;
        color: var(--blue-deep);
      }
      .peta-cell-tl {
        grid-column: 1;
        grid-row: 1;
      }
      .peta-cell-tr {
        grid-column: 3;
        grid-row: 1;
      }
      .peta-cell-bl {
        grid-column: 1;
        grid-row: 3;
      }
      .peta-cell-br {
        grid-column: 3;
        grid-row: 3;
      }
      @media (max-width: 880px) {
        .peta-map-grid {
          display: flex;
          flex-direction: column;
          gap: 16px;
        }
        .peta-map svg.connectors {
          display: none;
        }
        .peta-center-cell {
          order: 0;
        }
        .peta-corner {
          width: 100%;
        }
      }
      .peta-nodes {
        display: none;
      }

      /* MISI cards */
      .misi-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 22px;
      }
      .misi-card {
        background: #fff;
        border-radius: var(--radius);
        border: 1.5px solid var(--line);
        padding: 26px 22px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        transition:
          transform 0.2s,
          box-shadow 0.2s;
        position: relative;
      }
      .misi-card:hover {
        transform: translateY(-6px);
        box-shadow: var(--shadow);
      }
      .misi-top {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
      }
      .misi-num {
        font-family: "Baloo 2";
        font-weight: 800;
        color: var(--green-soft);
        font-size: 1.4rem;
      }
      .misi-icon {
        font-size: 2rem;
      }
      .misi-card h3 {
        font-size: 1.1rem;
      }
      .misi-card p {
        color: #5a6b65;
        font-size: 0.92rem;
        flex: 1;
      }
      .mini-progress {
        height: 8px;
        background: var(--green-pale);
        border-radius: 999px;
        overflow: hidden;
      }
      .mini-progress-fill {
        height: 100%;
        background: var(--green-deep);
        border-radius: 999px;
        transition: width 0.3s;
      }
      .misi-status {
        font-size: 0.78rem;
        font-weight: 800;
        color: var(--green-deep);
      }
      @media (max-width: 980px) {
        .misi-grid {
          grid-template-columns: 1fr 1fr;
        }
      }
      @media (max-width: 560px) {
        .misi-grid {
          grid-template-columns: 1fr;
        }
      }

      /* GLOSARIUM accordion */
      .glos-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
        max-width: 820px;
        margin: 0 auto;
      }
      .glos-item {
        background: #fff;
        border: 1.5px solid var(--line);
        border-radius: 14px;
        overflow: hidden;
      }
      .glos-q {
        width: 100%;
        text-align: left;
        background: none;
        border: none;
        padding: 16px 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-weight: 800;
        color: var(--blue-deep);
        font-size: 1rem;
      }
      .glos-q:hover {
        background: var(--green-pale);
      }
      .glos-a {
        max-height: 0;
        overflow: hidden;
        transition: max-height 0.25s ease;
        padding: 0 20px;
        color: #4a5d57;
      }
      .glos-item.open .glos-a {
        max-height: 200px;
        padding: 0 20px 18px;
      }
      .glos-item.open .glos-q {
        color: var(--green-deep);
      }
      .chev {
        transition: transform 0.2s;
      }
      .glos-item.open .chev {
        transform: rotate(180deg);
      }

      /* FOOTER */
      footer {
        background: var(--blue-deep);
        color: #dce9ec;
        padding: 56px 0 26px;
        margin-top: 40px;
      }
      .footer-top {
        display: flex;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 30px;
      }
      footer h3 {
        color: #fff;
      }
      footer .foot-tag {
        color: #a9c2c9;
        margin-top: 8px;
        max-width: 320px;
      }
      .foot-nav {
        display: flex;
        gap: 22px;
        flex-wrap: wrap;
      }
      .foot-nav a,
      .foot-nav button {
        background: none;
        border: none;
        color: #dce9ec;
        font-weight: 700;
        font-family: inherit;
        font-size: 0.95rem;
      }
      .foot-nav button:hover {
        color: var(--yellow);
      }
      .foot-msg {
        margin-top: 30px;
        padding-top: 24px;
        border-top: 1px solid rgba(255, 255, 255, 0.15);
        text-align: center;
        color: #a9c2c9;
        font-style: italic;
      }
      .foot-copy {
        text-align: center;
        margin-top: 14px;
        color: #7e97a0;
        font-size: 0.85rem;
      }

      /* PAGE HEADER for inner pages */
      .page-hero {
        padding: 44px 0 40px;
        background: linear-gradient(160deg, var(--green-pale), var(--cream));
        border-bottom: 1.5px solid var(--line);
      }
      .breadcrumb {
        display: flex;
        gap: 8px;
        align-items: center;
        font-size: 0.88rem;
        color: #5a6b65;
        margin-bottom: 16px;
        flex-wrap: wrap;
      }
      .breadcrumb button {
        background: none;
        border: none;
        font-weight: 800;
        color: var(--green-deep);
        font-family: inherit;
      }
      .page-hero h1 {
        font-size: 2.1rem;
      }
      .page-hero .sub {
        color: #3e534c;
        margin-top: 8px;
        max-width: 640px;
      }
      .page-badges {
        display: flex;
        gap: 8px;
        margin-top: 16px;
        flex-wrap: wrap;
      }
      .back-row {
        margin-top: 20px;
      }

      /* CARDS generic */
      .card {
        background: #fff;
        border: 1.5px solid var(--line);
        border-radius: var(--radius);
        padding: 26px;
      }
      .card + .card {
        margin-top: 20px;
      }
      .card h3 {
        font-size: 1.2rem;
        margin-bottom: 10px;
      }
      .card h4 {
        font-size: 1.02rem;
        color: var(--green-deep);
        margin-bottom: 8px;
      }
      .two-col {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
      }
      @media (max-width: 760px) {
        .two-col {
          grid-template-columns: 1fr;
        }
      }

      .formula {
        background: var(--blue-deep);
        color: #fff;
        border-radius: 14px;
        padding: 16px 22px;
        font-family: "Baloo 2";
        font-size: 1.15rem;
        text-align: center;
        margin: 14px 0;
        letter-spacing: 0.02em;
      }
      .formula.light {
        background: var(--green-pale);
        color: var(--blue-deep);
        border: 1.5px dashed var(--green-soft);
      }

      table.matter {
        width: 100%;
        border-collapse: collapse;
        margin: 14px 0;
        font-size: 0.92rem;
      }
      table.matter th,
      table.matter td {
        border: 1px solid var(--line);
        padding: 10px 12px;
        text-align: center;
      }
      table.matter th {
        background: var(--green-pale);
        color: var(--blue-deep);
      }

      .field-label {
        font-weight: 800;
        color: var(--blue-deep);
        font-size: 0.92rem;
        margin: 14px 0 6px;
        display: block;
      }
      input[type="text"],
      input[type="number"],
      textarea {
        width: 100%;
        padding: 12px 14px;
        border-radius: 10px;
        border: 1.5px solid var(--line);
        font-family: inherit;
        font-size: 1rem;
        background: #fcfbf7;
      }
      textarea {
        min-height: 80px;
        resize: vertical;
      }
      input:focus,
      textarea:focus {
        outline: 3px solid var(--blue-sky);
        outline-offset: 1px;
        border-color: var(--blue-sky);
      }
      .mc-options {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-top: 6px;
      }
      .mc-option {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 14px;
        border: 1.5px solid var(--line);
        border-radius: 10px;
        cursor: pointer;
      }
      .mc-option:hover {
        border-color: var(--blue-sky);
      }
      .mc-option input {
        width: 18px;
        height: 18px;
      }

      .feedback {
        margin-top: 14px;
        padding: 14px 18px;
        border-radius: 12px;
        font-weight: 700;
        display: none;
        align-items: center;
        gap: 10px;
      }
      .feedback.show {
        display: flex;
      }
      .feedback.ok {
        background: var(--green-pale);
        color: var(--green-deep);
        border: 1.5px solid var(--green-soft);
      }
      .feedback.bad {
        background: var(--coral-pale);
        color: #c24a34;
        border: 1.5px solid #ffc7b8;
      }

      .hint-box {
        margin-top: 12px;
        background: #fff7e0;
        border: 1.5px solid var(--yellow);
        border-radius: 12px;
        padding: 12px 16px;
        color: #6b5100;
        font-weight: 600;
        display: none;
      }
      .hint-box.show {
        display: block;
      }

      .step-actions {
        display: flex;
        gap: 12px;
        margin-top: 20px;
        flex-wrap: wrap;
      }

      /* stepper tracker (pemodelan / sifat) */
      .tracker {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin: 22px 0 6px;
      }
      .tracker .dot {
        flex: 1;
        min-width: 90px;
        text-align: center;
        padding: 10px 6px;
        border-radius: 10px;
        font-size: 0.75rem;
        font-weight: 800;
        background: #fff;
        border: 1.5px solid var(--line);
        color: #8a9a94;
      }
      .tracker .dot.done {
        background: var(--green-deep);
        color: #fff;
        border-color: var(--green-deep);
      }
      .tracker .dot.current {
        background: var(--yellow);
        color: #6b5100;
        border-color: var(--yellow);
      }

      .check-row {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        padding: 8px 0;
      }
      .check-row input {
        width: 20px;
        height: 20px;
        margin-top: 2px;
      }

      .pembahasan {
        margin-top: 14px;
        background: var(--green-pale);
        border-radius: 12px;
        padding: 16px 18px;
        display: none;
      }
      .pembahasan.show {
        display: block;
      }

      .pill-select {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-top: 6px;
      }
      .pill-select label {
        border: 1.5px solid var(--line);
        border-radius: 999px;
        padding: 8px 16px;
        font-weight: 700;
        font-size: 0.88rem;
        display: flex;
        align-items: center;
        gap: 6px;
        cursor: pointer;
      }
      .pill-select input {
        width: 16px;
        height: 16px;
      }

      .toast {
        position: fixed;
        bottom: 26px;
        left: 50%;
        transform: translateX(-50%) translateY(20px);
        background: var(--blue-deep);
        color: #fff;
        padding: 14px 26px;
        border-radius: 999px;
        font-weight: 700;
        box-shadow: var(--shadow);
        opacity: 0;
        pointer-events: none;
        transition: 0.3s ease;
        z-index: 999;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }

      .tooltip-wrap {
        position: relative;
        display: inline-flex;
      }
      .tooltip-wrap .tip {
        visibility: hidden;
        opacity: 0;
        position: absolute;
        bottom: 130%;
        left: 50%;
        transform: translateX(-50%);
        background: var(--blue-deep);
        color: #fff;
        padding: 6px 10px;
        border-radius: 8px;
        font-size: 0.75rem;
        white-space: nowrap;
        transition: 0.15s;
      }
      .tooltip-wrap:hover .tip {
        visibility: visible;
        opacity: 1;
      }

      /* profil */
      .profil-grid {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 20px;
      }
      .profil-card {
        background: #fff;
        border-radius: var(--radius);
        border: 1.5px solid var(--line);
        padding: 22px 18px;
        text-align: center;
        transition: transform 0.2s;
      }
      .profil-card:hover {
        transform: translateY(-5px);
        box-shadow: var(--shadow);
      }
      .profil-photo {
        width: 88px;
        height: 88px;
        border-radius: 50%;
        margin: 0 auto 14px;
        background: linear-gradient(160deg, var(--green-soft), var(--blue-sky));
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-size: 2rem;
      }
      .profil-card h4 {
        font-size: 1rem;
      }
      .profil-card .role {
        color: var(--green-deep);
        font-weight: 800;
        font-size: 0.82rem;
        margin: 4px 0 8px;
      }
      .profil-card p {
        font-size: 0.85rem;
        color: #5a6b65;
      }
      @media (max-width: 980px) {
        .profil-grid {
          grid-template-columns: repeat(3, 1fr);
        }
      }
      @media (max-width: 620px) {
        .profil-grid {
          grid-template-columns: 1fr 1fr;
        }
      }

      /* problem block for pemodelan */
      .story-box {
        background: var(--green-pale);
        border-radius: 14px;
        padding: 20px 22px;
        border: 1.5px dashed var(--green-soft);
        font-size: 0.98rem;
        color: #2f4a41;
      }
      .story-box p {
        margin: 0 0 10px;
      }
      .story-box p:last-child {
        margin-bottom: 0;
      }
      .task-item {
        border-top: 1px solid var(--line);
        padding: 16px 0;
      }
      .task-item:first-child {
        border-top: none;
      }
      .task-num {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 26px;
        height: 26px;
        border-radius: 50%;
        background: var(--blue-deep);
        color: #fff;
        font-size: 0.8rem;
        font-weight: 800;
        margin-right: 8px;
      }

      /* animations */
      .fade-in {
        opacity: 1;
        transform: translateY(0);
        transition:
          opacity 0.5s ease,
          transform 0.5s ease;
      }
      .fade-in.pre {
        opacity: 0;
        transform: translateY(16px);
      }
      .fade-in.pre.visible {
        opacity: 1;
        transform: translateY(0);
      }
      .bounce-check {
        display: inline-block;
        animation: pop 0.4s ease;
      }
      @keyframes pop {
        0% {
          transform: scale(0);
        }
        70% {
          transform: scale(1.25);
        }
        100% {
          transform: scale(1);
        }
      }
      .done-anim {
        text-align: center;
        padding: 26px 0;
      }
      .done-anim .big-emoji {
        font-size: 3.5rem;
        animation: pop 0.5s ease;
      }

      .skip-link {
        position: absolute;
        left: -999px;
        top: 0;
        background: var(--blue-deep);
        color: #fff;
        padding: 10px 16px;
        border-radius: 8px;
        z-index: 1000;
      }
      .skip-link:focus {
        left: 16px;
        top: 16px;
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          animation-duration: 0.001ms !important;
          transition-duration: 0.001ms !important;
        }
      }
    </style>

      /* ============ PENYIMPANAN PROGRES DI BROWSER ============ */
      const STORE_KEY = "aljabarcinta_progress_v2";
      function loadProgress() {
        try {
          return JSON.parse(localStorage.getItem(STORE_KEY)) || {};
        } catch (e) {
          return {};
        }
      }
      function saveProgress(p) {
        try {
          localStorage.setItem(STORE_KEY, JSON.stringify(p));
        } catch (e) {
          showToast("Penyimpanan perangkat gagal. Jangan tutup halaman sebelum menyalin jawaban.");
        }
      }
      let progress = loadProgress();

      const MISI_LIST = ["unsur", "operasi", "sifat", "pemodelan"];
      function setMisiStep(misi, stepKey, value) {
        progress[misi] = progress[misi] || {};
        progress[misi][stepKey] = value;
        saveProgress(progress);
        updateGlobalProgress();
      }
      function getMisiPercent(misi, totalSteps) {
        const done = progress[misi] ? Object.values(progress[misi]).filter(Boolean).length : 0;
        return Math.round((done / totalSteps) * 100);
      }
      const MISI_TOTALS = { unsur: 4, operasi: 4, sifat: 10, pemodelan: 12 };
      const MATERI_TOTALS = { materiUnsur: 3, materiOperasi: 4 };
      function updateGlobalProgress() {
        let totalDone = 0,
          totalAll = 0;
        MISI_LIST.forEach((m) => {
          const t = MISI_TOTALS[m];
          totalAll += t;
          totalDone += progress[m] ? Object.values(progress[m]).filter(Boolean).length : 0;
        });
        const pct = totalAll ? Math.round((totalDone / totalAll) * 100) : 0;
        document.getElementById("progressFill").style.width = pct + "%";
      }
      function showToast(msg) {
        const t = document.getElementById("toast");
        document.getElementById("toastText").textContent = msg;
        t.classList.add("show");
        clearTimeout(window._toastTimer);
        window._toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
      }

      /* ============ RENDER ROUTER ============ */
      function render() {
        const hash = location.hash.replace("#", "") || "beranda";
        const [page, sub] = hash.split("/");
        const main = document.getElementById("main");
        window.scrollTo({ top: 0, behavior: "instant" in window ? "instant" : "auto" });
        setActiveNav(page);
        updateGlobalProgress();

        if (page === "beranda") main.innerHTML = pageBeranda();
        else if (page === "pilihan") main.innerHTML = pagePilihan();
        else if (page === "petunjuk") main.innerHTML = pagePetunjuk();
        else if (page === "materi-peta") main.innerHTML = pageMateriPeta();
        else if (page === "materi-unsur") main.innerHTML = pageMateriUnsur();
        else if (page === "materi-operasi") main.innerHTML = pageMateriOperasi();
        else if (page === "materi-sifat") main.innerHTML = pageMateriSifat();
        else if (page === "misi-peta") main.innerHTML = pageMisiPeta();
        else if (page === "misi-unsur") main.innerHTML = pageMisiUnsur(sub ? parseInt(sub) : 1);
        else if (page === "misi-operasi") main.innerHTML = pageMisiOperasi(sub ? parseInt(sub) : 1);
        else if (page === "misi-sifat")
          main.innerHTML = sub ? pageSifat(parseInt(sub) || 1) : pageSifatMenu();
        else if (page === "sifat-pdf") main.innerHTML = pageSifatPDF(Number(sub) || 1);
        else if (page === "respons") main.innerHTML = pageRespons();
        else if (page === "misi-pemodelan") main.innerHTML = pagePemodelan(sub || null);
        else if (page === "profil") main.innerHTML = pageProfil();
        else main.innerHTML = pageBeranda();

        afterRender(page, sub);
        observeFadeIns();
      }

      function observeFadeIns() {
        const els = document.querySelectorAll(".fade-in");
        els.forEach((el) => el.classList.add("pre"));
        const io = new IntersectionObserver(
          (entries) => {
            entries.forEach((e) => {
              if (e.isIntersecting) {
                e.target.classList.add("visible");
                io.unobserve(e.target);
              }
            });
          },
          { threshold: 0.05 },
        );
        els.forEach((el) => io.observe(el));
        /* jaring pengaman: pastikan konten tetap tampil walau observer gagal/telat (mis. saat screenshot/print) */
        clearTimeout(window._fadeSafety);
        window._fadeSafety = setTimeout(() => {
          els.forEach((el) => el.classList.add("visible"));
        }, 1000);
      }

      /* Pemeriksa bentuk aljabar yang fleksibel: menerima urutan suku berbeda,
   spasi, tanda kali eksplisit/implisit, selama nilainya (secara struktur) sama. */
      function canonicalAlg(input) {
        if (input === undefined || input === null) return null;
        let s = String(input)
          .toLowerCase()
          .replace(/\s+/g, "")
          .replace(/−/g, "-")
          .replace(/×/g, "*")
          .replace(/\*/g, "")
          .replace(/²/g, "^2");
        if (s === "") return null;
        if (!/^[+-]/.test(s)) s = "+" + s;
        const terms = s.match(/[+-][^+-]+/g) || [];
        const vars = {};
        let constant = 0;
        let valid = true;
        terms.forEach((t) => {
          const sign = t[0] === "-" ? -1 : 1;
          const body = t.slice(1);
          const m = body.match(/^(\d*\.?\d*)([a-z])(\^2)?$/);
          if (m) {
            const coef = m[1] === "" ? 1 : parseFloat(m[1]);
            const key = m[2] + (m[3] ? "^2" : "");
            vars[key] = (vars[key] || 0) + sign * coef;
          } else if (/^\d*\.?\d+$/.test(body)) {
            constant += sign * parseFloat(body);
          } else if (body !== "") {
            valid = false;
          }
        });
        if (!valid) return null;
        const keys = Object.keys(vars)
          .filter((k) => vars[k] !== 0)
          .sort();
        return keys.map((k) => `${vars[k]}${k}`).join(",") + `|${constant}`;
      }
      function algEquals(userAnswer, correctAnswer) {
        const u = canonicalAlg(userAnswer);
        const c = canonicalAlg(correctAnswer);
        if (u === null) return false;
        return u === c;
      }

      /* Parser polinomial terbatas, tanpa eval; menerima kurung dan perkalian implisit. */
      canonicalAlg = function (input) {
        try {
          const s = String(input ?? "")
            .toLowerCase()
            .replace(/\s/g, "")
            .replace(/−/g, "-")
            .replace(/[×·]/g, "*")
            .replace(/²/g, "^2")
            .replace(/:/g, "/");
          if (!s || s.length > 200) return null;
          const ts = s.match(/\d+(?:\.\d+)?|[a-z]|[()+*/^\-]/g) || [];
          if (ts.join("") !== s) return null;
          let pos = 0;
          const add = (a, b, k = 1) => {
            const r = { ...a };
            for (const m in b) r[m] = (r[m] || 0) + k * b[m];
            return r;
          };
          const mul = (a, b) => {
            const r = {};
            for (const x in a)
              for (const y in b) {
                const k = (x + y).split("").sort().join("");
                if (k.length > 6) throw 0;
                r[k] = (r[k] || 0) + a[x] * b[y];
              }
            return r;
          };
          function atom() {
            let p;
            const t = ts[pos++];
            if (t === "+") return atom();
            if (t === "-") return mul({ "": -1 }, atom());
            if (t === "(") {
              p = expr();
              if (ts[pos++] !== ")") throw 0;
            } else if (/^[a-z]$/.test(t || "")) p = { [t]: 1 };
            else if (/^\d/.test(t || "")) p = { "": Number(t) };
            else throw 0;
            if (ts[pos] === "^") {
              pos++;
              const n = Number(ts[pos++]);
              if (!Number.isInteger(n) || n < 0 || n > 6) throw 0;
              let q = { "": 1 };
              for (let i = 0; i < n; i++) q = mul(q, p);
              p = q;
            }
            return p;
          }
          function term() {
            let p = atom();
            while (pos < ts.length) {
              const t = ts[pos];
              if (t === "*") {
                pos++;
                p = mul(p, atom());
              } else if (t === "/") {
                pos++;
                const q = atom();
                if (Object.keys(q).some((k) => k !== "" && q[k] !== 0) || !q[""]) throw 0;
                p = mul(p, { "": 1 / q[""] });
              } else if (t === "(" || /^[a-z0-9]/.test(t)) {
                p = mul(p, atom());
              } else break;
            }
            return p;
          }
          function expr() {
            let p = term();
            while (ts[pos] === "+" || ts[pos] === "-") {
              const k = ts[pos++] === "+" ? 1 : -1;
              p = add(p, term(), k);
            }
            return p;
          }
          const p = expr();
          if (pos !== ts.length) return null;
          return (
            Object.keys(p)
              .filter((k) => Math.abs(p[k]) > 1e-10)
              .sort()
              .map((k) => k + ":" + Number(p[k].toFixed(10)))
              .join("|") || "0"
          );
        } catch (e) {
          return null;
        }
      };

            "Coba pada situasi lain",
            `<p>Lima paket makanan ramah lingkungan disiapkan untuk kegiatan sekolah. Setiap paket berisi sejumlah bungkus daun dan 2 sendok kayu.</p><div class="native-packages">${Array.from({ length: 5 }, () => nativeImage("paket-makanan", "Paket makanan ramah lingkungan")).join("")}</div><p class="native-question">Tuliskan bentuk aljabar yang menyatakan jumlah seluruh barang.</p>${nativePair(n)}`,
          );
          body +=
            nativeStage(
              3,
              "Model for 2",
              "Temukan pola dari beberapa kasus",
              `<p>Lengkapi bentuk kelompok dan bentuk setelah didistribusikan.</p><div class="native-grid three">${[
                ["kasus-botol", "3 kelompok (botol + 4 gelas)"],
                ["kasus-kertas", "6 kotak (kertas + 2 tali)"],
                ["kasus-bibit", "4 wadah (bibit + 3 penanda)"],
              ]
                .map(
                  ([img, title], i) =>
                    `<div class="native-tile"><h3>${title}</h3>${nativeImage(img, title)}${nativeField(n, "kasus" + (i + 1) + "a", "Bentuk kelompok")}${nativeField(n, "kasus" + (i + 1) + "b", "Bentuk setelah didistribusikan")}</div>`,
                )
                .join("")}</div>`,
            ) +
            nativeConclusion(n, type) +
            nativeExercises(
              n,
              ["4(p + 2)", "5(a + 3b)", "2(3x + 4)", "5(b + 2) + 3b"],
              "Sederhanakan bentuk aljabar berikut.",
            );
        }
        const theme = n < 3 ? "komutatif" : n < 5 ? "asosiatif" : "distributif",
          tag =
            n < 3
              ? "Urutan boleh berbeda, hasil tetap sama"
              : n < 5
                ? "Cara mengelompokkan boleh berbeda, hasil tetap sama"
                : "Perkalian pada kelompok berlaku untuk setiap bagian di dalamnya";
        return /* HTML */ `<article class="native-lesson ${theme}">
          <div class="native-top">
            <button class="secondary" onclick="go('misi-sifat')">← Menu Sifat Aljabar</button
            ><span>Halaman ${n} dari 6</span>
          </div>
          <header class="native-hero">
            <div>
              <h1>Sifat ${type}</h1>
              <p>${tag}</p>
            </div>
            ${nativeImage(n < 3 ? "hero-k" : n < 5 ? "hero-a" : "hero-d", "Ilustrasi kegiatan peduli lingkungan")}
          </header>
          <div class="native-content">
            ${body}
            <p id="pdf-status" class="native-feedback" role="status" aria-live="polite">
              Jawaban disimpan pada browser ini. Uraian dan kesimpulan ditinjau guru.
            </p>
            <nav class="native-pagination" aria-label="Navigasi aktivitas">
              <button
                class="secondary"
                onclick="${n === 1 ? "go('misi-sifat')" : `go('sifat-pdf','${n - 1}')`}"
              >
                ← Sebelumnya</button
              ><button onclick="pdfNext(${n})">
                ${n === 2 ? "Lanjut ke Asosiatif →" : n === 4 ? "Lanjut ke Distributif →" : n === 6 ? "Selesai" : "Lanjut →"}
              </button>
            </nav>
          </div>
        </article>`;
      }
      function pdfPaint() {
        const st = pdfState(),
          k = document.getElementById("kom-kantin"),
          l = document.getElementById("kom-lapangan");
        if (k && l) {
          k.style.order = st.swapped ? 2 : 0;
          l.style.order = st.swapped ? 0 : 2;
          const got = st.collected || [];
          document.getElementById("pdf-total").textContent =
            got.length === 2
              ? "4 + 3 = 3 + 4 = 7 botol"
              : got.length === 1
                ? got[0] === "kom-kantin"
                  ? "4 botol"
                  : "3 botol"
                : "Jumlah seluruh botol";
        }
        for (const [key, id] of [
          ["left", "asos-kiri"],
          ["right", "asos-kanan"],
        ]) {
          const e = document.getElementById(id);
          if (!e) continue;
          const got = st[key] || [],
            expected = key === "left" ? ["kantin", "taman"] : ["taman", "lapangan"],
            valid = got.length === 2 && expected.every((x) => got.includes("asos-card-" + x));
          e.innerHTML = got.length
            ? got
                .map(
                  (x) =>
                    `<span class="native-mini">${nativeImage("dua-kantong", "Dua kantong")}<small>${x.split("-").pop()}</small></span>`,
                )
                .join("") + (valid ? "<strong>2 + 2 = 4; seluruhnya 6</strong>" : "")
            : "Letakkan dua kotak di sini";
        }
      }
      function pdfSituation(n) {
        if (!val(`pdf-${n}-situasi`)) {
          pdfStatus("Tuliskan jawaban situasi terlebih dahulu.");
          document.getElementById(`pdf-${n}-situasi`).focus();
          return;
        }
        pdfStatus("Jawaban tersimpan untuk ditinjau guru.");
        document
          .getElementById("native-model")
          .scrollIntoView({ behavior: "smooth", block: "start" });
      }
      function checkNativeFormula(n, input) {
        const sides = pdfClean(input).split("=");
        if (sides.length !== 2) return false;
        const [a, b] = sides;
        if (n === 2) return pdfAddPair(a, b);
        if (n === 4) return pdfAddPair(a, b, true);
        const check = (x, y) => {
          const m = x.match(/^([a-z])\*?\(([a-z])\+([a-z])\)$/);
          return !!(
            m &&
            new Set(m.slice(1)).size === 3 &&
            !/[()]/.test(y) &&
            algEquals(y, m[1] + m[2] + "+" + m[1] + m[3])
          );
        };
        return check(a, b) || check(b, a);
      }
      for (const n of [2, 4, 6]) PDF_FIELDS[n].push(["kesimpulan"], ["rumus"]);
      const nativeNext = pdfNext;
      pdfNext = function (n) {
        if (
          [2, 4, 6].includes(n) &&
          (!val(`pdf-${n}-kesimpulan`) || !checkNativeFormula(n, val(`pdf-${n}-rumus`)))
        ) {
          pdfStatus(
            "Lengkapi kesimpulan dan tuliskan persamaan pola umum yang sesuai dengan sifatnya.",
          );
          document
            .getElementById(`pdf-${n}-${!val(`pdf-${n}-kesimpulan`) ? "kesimpulan" : "rumus"}`)
            .focus();
          return false;
        }
        return nativeNext(n);
      };
      function pageSifatMenu() {
        return /* HTML */ `${misiHeader({ title: "Sifat Aljabar", badge: "", sub: "Pilih misi sifat aljabar.", breadcrumbLast: "Sifat Aljabar" })}
          <section class="section">
            <div class="wrap">
              <div class="sifat-menu">
                ${[1, 3, 5].map((n, i) => `<button class="sifat-option" onclick="go('sifat-pdf','${n}')"><img src="${pdfAsset("menu/" + ["banner-komutatif.png", "banner-asosiatif.jpg", "banner-distributif.png"][i])}" alt="Sifat ${PDF_TITLES[n - 1]}"><span>Sifat ${PDF_TITLES[n - 1]}</span></button>`).join("")}<button
                  class="sifat-option"
                  onclick="go('misi-sifat','1')"
                >
                  <span>Kotak Pilah Sampah Mini</span><span>Isi sifat aljabar sebelumnya</span>
                </button>
              </div>
            </div>
          </section>`;
      }

      /* init */
      render();
    </script>
  </body>
</html>
